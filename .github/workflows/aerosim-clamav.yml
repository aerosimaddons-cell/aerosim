name: AEROSIM ClamAV file scanner

on:
  push:
    paths:
      - ".github/workflows/aerosim-clamav.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: aerosim-clamav-queue
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install ClamAV and tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam jq curl
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --version
          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > /tmp/aerosim-eicar-test.com
          set +e
          clamscan --no-summary /tmp/aerosim-eicar-test.com > /tmp/aerosim-eicar-test.log 2>&1
          eicar_rc=$?
          set -e
          if [[ "$eicar_rc" -ne 1 ]] || ! grep -Eqi 'EICAR.*FOUND|FOUND.*EICAR' /tmp/aerosim-eicar-test.log; then
            cat /tmp/aerosim-eicar-test.log
            echo "ClamAV signature self-test failed; uploads will not be auto-approved."
            exit 1
          fi
          echo "ClamAV EICAR signature self-test passed."
          rm -f /tmp/aerosim-eicar-test.com /tmp/aerosim-eicar-test.log

      - name: Claim and scan queued mods
        shell: bash
        env:
          BRIDGE: https://mqczfatgxuhrhrkniulf.supabase.co/functions/v1/aerosim-clamav-bridge
        run: |
          set -euo pipefail

          get_oidc() {
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aerosim-clamav-scan" | jq -r '.value'
          }

          post_result() {
            local payload="$1"
            local token
            token="$(get_oidc)"
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "${BRIDGE}/result"
          }

          post_progress() {
            local mod_id="$1" stage="$2" file_name="$3" completed="$4" total="$5"
            local token payload
            token="$(get_oidc)"
            payload="$(jq -cn --arg id "$mod_id" --arg stage "$stage" --arg file "$file_name" \
              --argjson completed "$completed" --argjson total "$total" \
              '{mod_id:$id,stage:$stage,current_file:$file,completed_steps:$completed,total_steps:$total}')"
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" --data "$payload" "${BRIDGE}/progress"
          }

          for job_number in 1 2 3; do
            token="$(get_oidc)"
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${token}" \
              "${BRIDGE}/claim")"

            mod_id="$(jq -r '.job.id // empty' <<< "$response")"
            if [[ -z "$mod_id" ]]; then
              echo "No pending mod scans; queue poll completed."
              break
            fi

            echo "Scanning queued mod: $mod_id"
            verdict="clean"
            detections='[]'
            scanned_files='[]'
            file_count="$(jq '.job.files | length' <<< "$response")"
            total_steps=$((file_count * 2))
            completed_steps=0
            if [[ "$file_count" -gt 0 ]]; then
              post_progress "$mod_id" "Preparing scan" "" "$completed_steps" "$total_steps"
            fi

            if [[ "$file_count" -eq 0 ]]; then
              verdict="review"
            else
              index=0
              while IFS= read -r file; do
                index=$((index + 1))
                file_url="$(jq -r '.url' <<< "$file")"
                file_name="$(jq -r '.name' <<< "$file")"
                expected_size="$(jq -r '.size' <<< "$file")"
                tmp="/tmp/aerosim-scan-${mod_id}-${index}.bin"
                log="/tmp/aerosim-scan-${mod_id}-${index}.log"

                post_progress "$mod_id" "Downloading file" "$file_name" "$completed_steps" "$total_steps"
                if ! curl --fail --location --silent --show-error \
                  --retry 3 --retry-all-errors --max-time 900 \
                  "$file_url" -o "$tmp"; then
                  verdict="review"
                  completed_steps=$((completed_steps + 2))
                  post_progress "$mod_id" "Download failed; moving to review" "$file_name" "$completed_steps" "$total_steps"
                  continue
                fi
                completed_steps=$((completed_steps + 1))
                post_progress "$mod_id" "Checking file integrity" "$file_name" "$completed_steps" "$total_steps"

                actual_size="$(stat -c%s "$tmp")"
                if [[ "$actual_size" != "$expected_size" ]]; then
                  verdict="review"
                  completed_steps=$((completed_steps + 1))
                  post_progress "$mod_id" "File check failed; moving to review" "$file_name" "$completed_steps" "$total_steps"
                  rm -f "$tmp"
                  continue
                fi

                post_progress "$mod_id" "Scanning with ClamAV" "$file_name" "$completed_steps" "$total_steps"
                set +e
                clamscan --infected --no-summary \
                  --alert-encrypted=yes \
                  --alert-broken=yes \
                  --alert-exceeds-max=yes \
                  --max-filesize=1900M \
                  --max-scansize=3500M \
                  --max-files=100000 \
                  --max-recursion=30 \
                  --max-scantime=0 \
                  "$tmp" > "$log" 2>&1
                scan_rc=$?
                set -e

                if grep -Eqi 'Heuristics\.(Limits\.Exceeded|Encrypted)|Broken\.Executable' "$log"; then
                  verdict="review"
                  found="$(grep -E 'FOUND' "$log" | sed 's/^.*: //' | head -n 10 | jq -R . | jq -s .)"
                  detections="$(jq -cn --argjson old "$detections" --argjson new "$found" '$old + $new | .[:30]')"
                elif [[ "$scan_rc" -eq 1 ]]; then
                  verdict="infected"
                  found="$(grep 'FOUND' "$log" | sed 's/^.*: //' | head -n 10 | jq -R . | jq -s .)"
                  detections="$(jq -cn --argjson old "$detections" --argjson new "$found" '$old + $new | .[:30]')"
                elif [[ "$scan_rc" -ne 0 ]]; then
                  verdict="review"
                fi

                completed_steps=$((completed_steps + 1))
                post_progress "$mod_id" "File scan complete" "$file_name" "$completed_steps" "$total_steps"
                scanned_files="$(jq -cn --argjson old "$scanned_files" --arg name "$file_name" '$old + [$name] | .[:4]')"
                rm -f "$tmp" "$log"

                if [[ "$verdict" == "infected" ]]; then
                  break
                fi
              done < <(jq -c '.job.files[]' <<< "$response")
            fi

            payload="$(jq -cn \
              --arg id "$mod_id" \
              --arg verdict "$verdict" \
              --argjson detections "$detections" \
              --argjson scanned_files "$scanned_files" \
              '{mod_id:$id,verdict:$verdict,detections:$detections,scanned_files:$scanned_files}')"

            echo "Submitting scan result: $verdict"
            post_result "$payload"
          done
